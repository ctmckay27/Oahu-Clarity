name: mari-native-continuity-eos-probe

on:
  push:
    branches: [mari-native-continuity-verifier-fix-20260920]
    paths: ['.github/workflows/mari_native_continuity_eos_probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  QWEN_C_SHA: e391ec5467b0218eeb175f4888ad65b259d1e7c7
  CV_REV: 0c0e3051f131929182e2c023b9537f8b1c68adfe
  PROD_RUN: '35405800719'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy<2' soundfile scipy-openblas32 transformers tokenizers faster-whisper==1.2.1 pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: mari-voice-v1-production-xvector
          github-token: ${{ github.token }}
          run-id: ${{ env.PROD_RUN }}
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: mari-native-continuity-v1-diagnostic-abc
          github-token: ${{ github.token }}
          run-id: 35507991873
          path: evidence
      - name: Build the unchanged pinned native engine
        run: |
          python - <<'PY'
          import pathlib, subprocess, yaml
          doc = yaml.safe_load(pathlib.Path('.github/workflows/mari_native_continuity_v1_diagnostic.yml').read_text())
          steps = doc['jobs']['diagnose']['steps']
          step = next(s for s in steps if s.get('name') == 'Build exact patched single-request native renderer')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', step['run']], check=True)
          PY
      - name: Apply only the candidate EOS policy and render matched A/B/C
        run: |
          python - <<'PY'
          import difflib, hashlib, json, pathlib, subprocess, yaml
          path = pathlib.Path('omega_voice/generative_v5/native.py')
          before = path.read_text()
          blob = hashlib.sha1(b'blob '+str(len(before.encode())).encode()+b'\0'+before.encode()).hexdigest()
          assert blob == '49a1561b5dc13e78baae1ae63e0bc864e6127424', blob
          needle = "  from .text_release import read_release\n"
          assert before.count(needle) == 1
          after = before.replace(needle, "  # Source-release stalls invalidate the text-length EOS boost; natural EOS remains active.\n  cmd.extend(['--eos-strategy','off'])\n"+needle)
          path.write_text(after)
          pathlib.Path('EOS_CANDIDATE.patch').write_text(''.join(difflib.unified_diff(before.splitlines(True), after.splitlines(True), fromfile='a/'+str(path), tofile='b/'+str(path))))
          subprocess.run(['python', '-m', 'unittest', 'discover', '-s', 'omega_voice/native_conversational_continuity_v1/tests', '-v'], check=True)
          doc = yaml.safe_load(pathlib.Path('.github/workflows/mari_native_conversational_continuity_v1_verify.yml').read_text())
          steps = doc['jobs']['production-abc']['steps']
          for name in ['Build matched conversational and native continuity plans', 'Render matched A/B/C']:
              step = next(s for s in steps if s.get('name') == name)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', step['run']], check=True)
          PY
      - name: Preserve measurements before enforcing the unchanged production gate
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, yaml
          doc = yaml.safe_load(pathlib.Path('.github/workflows/mari_native_continuity_v1_diagnostic.yml').read_text())
          step = next(s for s in doc['jobs']['diagnose']['steps'] if s.get('name') == 'Diagnose mechanics and intelligibility')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', step['run']], check=True)
          old = json.loads(pathlib.Path('evidence/C_native_continuity.receipt.json').read_text())
          new = json.loads(pathlib.Path('C_native_continuity.receipt.json').read_text())
          keys = ['trajectory_sha256', 'text_release_sha256', 'profile_file_sha256', 'seed', 'text']
          same = {key: old[key] == new[key] for key in keys}
          old_codes = pathlib.Path('evidence/C_native_continuity.code0.txt').read_text().splitlines()
          new_codes = pathlib.Path('C_native_continuity.code0.txt').read_text().splitlines()
          first = next((i for i, (a,b) in enumerate(zip(old_codes,new_codes)) if a != b), min(len(old_codes), len(new_codes)))
          comparison = {'identical_inputs': same, 'first_different_code0_index': first, 'old_code0_count':len(old_codes), 'new_code0_count':len(new_codes), 'source_run':35507991873, 'candidate_native_py_sha256':hashlib.sha256(pathlib.Path('omega_voice/generative_v5/native.py').read_bytes()).hexdigest()}
          pathlib.Path('EOS_PROBE_COMPARISON.json').write_text(json.dumps(comparison, indent=2)+'\n')
          print(json.dumps(comparison, indent=2))
          assert all(same.values()), same
          doc = yaml.safe_load(pathlib.Path('.github/workflows/mari_native_conversational_continuity_v1_verify.yml').read_text())
          step = next(s for s in doc['jobs']['production-abc']['steps'] if s.get('name') == 'Verify native continuity and intelligibility')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', step['run']], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mari-native-continuity-eos-probe
          path: |
            EOS_CANDIDATE.patch
            EOS_PROBE_COMPARISON.json
            ABC_DIAGNOSTIC_RECEIPT.json
            ABC_VERIFICATION_RECEIPT.json
            A_whole_utterance.*
            B_stitched_incremental.*
            C_native_continuity.*
            C_native_continuity_native_packets/
            B_receipt.json
            C_receipt.json
            conversation_plan.json
            native_continuity_plan.json
          retention-days: 14
          compression-level: 0
