name: mari-voice-v1-xvector-harden

on:
  push:
    branches: [mari-voice-v1-finalize-20260918]
    paths: [.github/workflows/mari_voice_v1_xvector_harden.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mari-voice-v1-xvector-harden
  cancel-in-progress: true

env:
  QWEN_C_SHA: e391ec5467b0218eeb175f4888ad65b259d1e7c7
  CV_REV: 0c0e3051f131929182e2c023b9537f8b1c68adfe
  SOURCE_RUN: "35404742133"
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  harden-xvector:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: mari-v1-anchor-and-profiles
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          path: assets

      - name: Inspect persisted profiles
        run: |
          set -euo pipefail
          ls -lh assets
          test -s assets/mari_anchor.wav
          test -s assets/mari_v1.bin
          test -s assets/mari_v1.qvoice
          sha256sum assets/mari_anchor.wav assets/mari_v1.bin assets/mari_v1.qvoice > profile_input_sha256.txt

      - name: Build pinned production engine and exact CustomVoice model
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libopenblas-dev git ffmpeg
          git init engine
          git -C engine remote add origin https://github.com/gabriele-mastrapasqua/qwen3-tts.git
          git -C engine fetch --depth 1 origin "$QWEN_C_SHA"
          git -C engine checkout --detach FETCH_HEAD
          test "$(git -C engine rev-parse HEAD)" = "$QWEN_C_SHA"
          make -C engine blas SIMD=portable
          engine/qwen_tts --self-test
          engine/qwen_tts --caps > engine_caps.txt
          engine/qwen_tts --list-voices assets/mari_v1.qvoice > qvoice_inspect.txt 2>&1 || true
          cd engine
          sed "s|/resolve/main|/resolve/$CV_REV|g" download_model.sh > pinned_cv_download.sh
          bash pinned_cv_download.sh --model large --dir customvoice-large

      - name: Smoke-test x-vector production route
        run: |
          set -euo pipefail
          mkdir -p smoke
          set +e
          engine/qwen_tts -d engine/customvoice-large --load-voice assets/mari_v1.bin --xvector-only -l English             --text "The persistent speaker test is running on an unseen sentence."             --seed 73101 --temperature 0.42 -j4 -o smoke/xvector.wav > smoke/xvector.log 2>&1
          RC=$?
          set -e
          cat smoke/xvector.log
          test "$RC" -eq 0
          test -s smoke/xvector.wav

      - name: Install independent evaluation stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1' 'torchaudio==2.5.1'
          python -m pip install 'numpy<2' 'scipy==1.14.1' 'soundfile==0.13.1' 'librosa==0.10.2.post1' 'faster-whisper==1.2.1' 'speechbrain==1.0.3' 'huggingface-hub>=0.27,<1'
          git clone --depth 1 --branch v1.2.0 https://github.com/tarepan/SpeechMOS.git speechmos-evaluator

      - name: Install stable Omega Voice production interface
        run: |
          mkdir -p production hardening/audio hardening/logs
          cat > production/omega_voice.py <<'PY'
          import argparse, json, pathlib, re, subprocess, tempfile
          import numpy as np
          import soundfile as sf

          PERFORMANCE = {
              "neutral": "",
              "dry_amusement": "Dry understated amusement. A restrained intelligent smile in the timing, never cute, breathy, or theatrical.",
              "controlled_irritation": "Controlled irritation. Firmer consonants, contained force, clipped patience, no shouting and no theatrical anger.",
              "reassuring": "Calm direct reassurance. Grounded warmth, measured pace, steady clarity, never sentimental or whispery.",
              "focused_urgency": "Focused urgency. Purposeful faster pace, sharper emphasis, controlled intensity, no panic."
          }

          def split_text(text, limit=230):
              parts=[x.strip() for x in re.split(r'(?<=[.!?])\s+', text.strip()) if x.strip()]
              out=[]; cur=""
              for s in parts:
                  if cur and len(cur)+1+len(s)>limit:
                      out.append(cur); cur=s
                  else:
                      cur=(cur+" "+s).strip()
              if cur: out.append(cur)
              return out or [text]

          def render(engine, model, profile, text, performance, output, seed=88000):
              for p in (engine, model, profile):
                  if not pathlib.Path(p).exists():
                      raise FileNotFoundError(p)
              if performance not in PERFORMANCE:
                  raise ValueError(f"unknown performance: {performance}")
              chunks=split_text(text)
              arrays=[]; sr=None; commands=[]
              with tempfile.TemporaryDirectory() as td:
                  for i,ch in enumerate(chunks):
                      wav=pathlib.Path(td)/f"{i}.wav"
                      cmd=[engine,"-d",model,"--load-voice",profile,"--xvector-only","-l","English",
                           "--text",ch,"--seed",str(seed+i),"--temperature","0.42","--top-k","40",
                           "--top-p","0.95","--rep-penalty","1.05","-j4","-o",str(wav)]
                      instr=PERFORMANCE[performance]
                      if instr: cmd.extend(["--instruct",instr])
                      cp=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=420)
                      if cp.returncode != 0:
                          raise RuntimeError("renderer failed; no fallback used\n"+cp.stdout)
                      y,r=sf.read(wav,dtype="float32",always_2d=True); y=y.mean(1)
                      sr=sr or r
                      if r != sr: raise RuntimeError("sample-rate drift")
                      arrays.append(y)
                      if i < len(chunks)-1: arrays.append(np.zeros(int(sr*.10),dtype="float32"))
                      commands.append(cmd)
              audio=np.concatenate(arrays)
              sf.write(output,audio,sr,subtype="PCM_16")
              return {"chunks":len(chunks),"sample_rate":sr,"duration_s":len(audio)/sr,"commands":commands}

          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument("--engine",required=True); ap.add_argument("--model",required=True)
              ap.add_argument("--profile",required=True); ap.add_argument("--text",required=True)
              ap.add_argument("--performance",choices=PERFORMANCE,default="neutral")
              ap.add_argument("--output",required=True); ap.add_argument("--seed",type=int,default=88000)
              a=ap.parse_args()
              print(json.dumps(render(a.engine,a.model,a.profile,a.text,a.performance,a.output,a.seed)))
          if __name__=="__main__": main()
          PY

      - name: Execute held-out, performance, and long-form suite
        run: |
          python -u - <<'PY'
          import json,pathlib,subprocess
          cases=[
            ("heldout_1","neutral","The map is not wrong. It is answering a different question than the one we are asking."),
            ("heldout_2","neutral","Start with what changed overnight. If nothing changed, say that plainly and leave the rest alone."),
            ("heldout_3","neutral","You can keep the elegant explanation. I want the mechanism that actually produced the failure."),
            ("heldout_4","neutral","There are three possibilities. Two are easy to test, and the third only matters if those fail."),
            ("heldout_5","neutral","I am not asking whether it is possible in theory. I am asking whether it happened here."),
            ("heldout_6","neutral","That answer is almost useful. Put the uncertainty next to the claim it belongs to, then try again."),
            ("perf_amusement","dry_amusement","That is technically an answer. It is also a very creative way to avoid the question."),
            ("perf_irritation","controlled_irritation","Do not move the goalposts now. We agreed on the test before we saw the result."),
            ("perf_reassuring","reassuring","You have enough information to take the next step. I will tell you if the situation actually changes."),
            ("perf_urgent","focused_urgency","Move now. Take the clean route, leave the rest behind, and do not stop to solve a problem we do not have."),
            ("long_1","neutral","The first report made the incident look simple because it compressed three separate failures into one timeline. The sensor stopped updating, the alerting layer continued to display the last good value, and the handoff procedure assumed the display was live. None of those failures alone explains the delay. Together they created a believable false state. The fix is not a louder alarm. We need the system to represent freshness explicitly, make stale information visible at the point of use, and route uncertainty to the person who can act on it."),
            ("long_2","neutral","What matters here is not whether the model can produce an impressive answer once. A production system has to survive ordinary variation: longer sentences, interruptions, technical language, emotional pressure, and boring routine dialogue. Identity cannot disappear when the performance changes, and quality cannot depend on one lucky seed. So we test the voice the same way we would test any other persistent component. We hold the speaker constant, vary the conditions, measure what we can measure, and refuse to call a transient success a finished system.")
          ]
          rec=[]
          for i,(cid,perf,text) in enumerate(cases):
              out=f"hardening/audio/{cid}.wav"
              cmd=["python","production/omega_voice.py","--engine","engine/qwen_tts","--model","engine/customvoice-large",
                   "--profile","assets/mari_v1.bin","--text",text,"--performance",perf,"--output",out,"--seed",str(88100+i*7)]
              cp=subprocess.run(cmd,text=True,capture_output=True,timeout=900)
              pathlib.Path(f"hardening/logs/{cid}.txt").write_text(cp.stdout+"\nSTDERR\n"+cp.stderr)
              if cp.returncode != 0: raise SystemExit(f"render failure {cid}: {cp.stderr}")
              rec.append({"id":cid,"performance":perf,"text":text,"output":out,"command":cmd,"wrapper_stdout":cp.stdout.strip()})
              pathlib.Path("hardening/cases.json").write_text(json.dumps(rec,indent=2))
              print(cid,flush=True)
          PY

      - name: Evaluate production suite
        run: |
          python -u - <<'PY'
          import json,re,pathlib,hashlib,numpy as np,soundfile as sf,torch,librosa
          from math import gcd
          from scipy.signal import resample_poly
          from faster_whisper import WhisperModel
          from huggingface_hub import HfApi,snapshot_download
          from speechbrain.inference.speaker import EncoderClassifier
          torch.set_num_threads(4)
          mos=torch.hub.load("speechmos-evaluator","utmos22_strong",source="local").eval()
          aid="Systran/faster-whisper-small.en"; arev=HfApi().model_info(aid).sha
          asr=WhisperModel(snapshot_download(aid,revision=arev),device="cpu",compute_type="int8",cpu_threads=4)
          spk=EncoderClassifier.from_hparams(source="speechbrain/spkrec-ecapa-voxceleb",savedir="models/ecapa",run_opts={"device":"cpu"})
          selection=json.load(open("assets/anchor_meta.json"))
          rejected_max=float(selection["selected"]["max_rejected_similarity"])
          def words(t): return re.findall(r"[a-z0-9]+(?:'[a-z0-9]+)?",t.lower())
          def ed(a,b):
              p=list(range(len(b)+1))
              for i,x in enumerate(a,1):
                  c=[i]
                  for j,y in enumerate(b,1): c.append(min(c[-1]+1,p[j]+1,p[j-1]+(x!=y)))
                  p=c
              return p[-1]
          def load(p):
              y,sr=sf.read(p,dtype="float32",always_2d=True); y=y.mean(1)
              g=gcd(sr,16000); y16=resample_poly(y,16000//g,sr//g).astype("float32")
              return y,y16,sr
          def emb(y16):
              with torch.no_grad(): e=spk.encode_batch(torch.from_numpy(y16).float().unsqueeze(0)).squeeze().cpu().numpy()
              return e/np.linalg.norm(e)
          _,a16,_=load("assets/mari_anchor.wav"); anchor=emb(a16)
          # Calibrate same-speaker floor using x-vector validation and smoke outputs.
          calibration=[]
          for p in ["assets/profile_xvector_validation.wav","smoke/xvector.wav"]:
              _,y16,_=load(p); calibration.append(float(np.dot(anchor,emb(y16))))
          sim_threshold=max(rejected_max+0.05,min(calibration)-0.12,0.54)
          rows=[]
          for case in json.load(open("hardening/cases.json")):
              y,y16,sr=load(case["output"])
              with torch.no_grad(): m=float(mos(torch.from_numpy(y16).unsqueeze(0),16000).item())
              segs,_=asr.transcribe(y16,language="en",beam_size=5,temperature=0,condition_on_previous_text=False,vad_filter=False)
              hyp=" ".join(s.text.strip() for s in segs)
              sim=float(np.dot(anchor,emb(y16)))
              f0,_,_=librosa.pyin(y,fmin=70,fmax=350,sr=sr); med=float(np.nanmedian(f0)) if np.isfinite(f0).any() else None
              rate=len(words(case["text"]))*60/(len(y)/sr)
              row={**case,"sha256":hashlib.sha256(pathlib.Path(case["output"]).read_bytes()).hexdigest(),
                   "utmos":m,"speaker_similarity_to_anchor":sim,"wer":ed(words(case["text"]),words(hyp))/max(1,len(words(case["text"]))),
                   "asr_text":hyp,"duration_s":len(y)/sr,"f0_median_hz":med,"words_per_minute":rate,
                   "peak_abs":float(np.max(np.abs(y))),"clipped_fraction":float(np.mean(np.abs(y)>=.999))}
              row["quality_pass"]=bool(m>=4.05 and row["wer"]<=.10 and row["clipped_fraction"]<1e-4)
              row["identity_pass"]=bool(sim>=sim_threshold)
              rows.append(row); pathlib.Path("hardening/evaluation.json").write_text(json.dumps(rows,indent=2))
              print(case["id"],"MOS",round(m,3),"SIM",round(sim,3),"WER",round(row["wer"],3),flush=True)
          neutral=[r for r in rows if r["id"].startswith("heldout_")]
          perf=[r for r in rows if r["id"].startswith("perf_")]
          long=[r for r in rows if r["id"].startswith("long_")]
          nf=np.median([r["f0_median_hz"] for r in neutral if r["f0_median_hz"]]); nr=np.median([r["words_per_minute"] for r in neutral])
          varied=0
          for r in perf:
              fdelta=abs(r["f0_median_hz"]-nf)/nf if r["f0_median_hz"] else 0
              rdelta=abs(r["words_per_minute"]-nr)/nr
              r["performance_acoustically_distinct"]=bool(fdelta>.045 or rdelta>.075)
              varied += int(r["performance_acoustically_distinct"])
          summary={
              "profile_mode":"xvector",
              "speaker_similarity_threshold":sim_threshold,
              "threshold_calibration":{"rejected_max":rejected_max,"same_speaker_calibration":calibration},
              "neutral_passes":sum(r["quality_pass"] and r["identity_pass"] for r in neutral),
              "neutral_total":len(neutral),
              "performance_identity_passes":sum(r["quality_pass"] and r["identity_pass"] for r in perf),
              "performance_total":len(perf),
              "performance_acoustically_distinct":varied,
              "long_form_passes":sum(r["quality_pass"] and r["identity_pass"] for r in long),
              "long_form_total":len(long),
              "all_asr_pass":all(r["wer"]<=.10 for r in rows),
              "all_no_clip":all(r["clipped_fraction"]<1e-4 for r in rows),
              "mean_utmos":float(np.mean([r["utmos"] for r in rows])),
              "worst_utmos":min(r["utmos"] for r in rows),
              "mean_speaker_similarity":float(np.mean([r["speaker_similarity_to_anchor"] for r in rows]))
          }
          summary["production_readiness_pass"]=bool(summary["neutral_passes"]==6 and
              summary["performance_identity_passes"]==4 and varied>=3 and summary["long_form_passes"]==2 and
              summary["all_asr_pass"] and summary["all_no_clip"])
          pathlib.Path("hardening/evaluation.json").write_text(json.dumps(rows,indent=2))
          pathlib.Path("hardening/summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if not summary["production_readiness_pass"]: raise SystemExit("Production thresholds not met")
          PY

      - name: Build final production package
        run: |
          set -euo pipefail
          cp assets/mari_anchor.wav production/MARI_VOICE_V1_ANCHOR.wav
          cp assets/mari_v1.bin production/MARI_VOICE_V1_PROFILE.bin
          cp assets/anchor_meta.json production/MARI_VOICE_V1_ANCHOR_META.json
          cp assets/revisions.json production/MODEL_REVISIONS.json
          cp hardening/summary.json production/HARDENING_SUMMARY.json
          cp hardening/evaluation.json production/FINAL_EVALUATION.json
          cp hardening/cases.json production/FINAL_CASES.json
          cp engine_caps.txt production/ENGINE_CAPS.txt
          cp profile_input_sha256.txt production/PROFILE_INPUT_SHA256.txt
          cp qvoice_inspect.txt production/QVOICE_FAILED_ALTERNATIVE_INSPECTION.txt
          printf '%s\n' "$QWEN_C_SHA" > production/ENGINE_REVISION.txt
          printf '%s\n' "$CV_REV" > production/PRODUCTION_MODEL_REVISION.txt
          printf '%s\n' "xvector" > production/PROFILE_MODE.txt
          sha256sum production/* > production/SHA256SUMS.txt
          (cd production && zip -q ../MARI_VOICE_V1_PRODUCTION.zip *)

      - uses: actions/upload-artifact@v4
        with:
          name: mari-voice-v1-production-xvector
          path: |
            production/
            MARI_VOICE_V1_PRODUCTION.zip
            hardening/audio/
            hardening/logs/
            smoke/
          retention-days: 14
          compression-level: 0

  cold-start:
    needs: harden-xvector
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: mari-voice-v1-production-xvector
          path: package

      - name: Reconstruct engine/model from persisted revisions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libopenblas-dev git
          python -m pip install 'numpy<2' soundfile
          git init engine
          git -C engine remote add origin https://github.com/gabriele-mastrapasqua/qwen3-tts.git
          git -C engine fetch --depth 1 origin "$QWEN_C_SHA"
          git -C engine checkout --detach FETCH_HEAD
          test "$(git -C engine rev-parse HEAD)" = "$QWEN_C_SHA"
          make -C engine blas SIMD=portable
          cd engine
          sed "s|/resolve/main|/resolve/$CV_REV|g" download_model.sh > pinned_cv_download.sh
          bash pinned_cv_download.sh --model large --dir customvoice-large

      - name: Cold-start persisted voice and verify fail-closed behavior
        run: |
          set -euo pipefail
          python package/production/omega_voice.py --engine engine/qwen_tts --model engine/customvoice-large             --profile package/production/MARI_VOICE_V1_PROFILE.bin             --text "Cold start complete. This sentence was generated from persisted Mari Voice v1 assets in a clean runner."             --performance neutral --output cold_start.wav --seed 99117 > cold_start_meta.json
          test -s cold_start.wav
          set +e
          python package/production/omega_voice.py --engine engine/qwen_tts --model engine/customvoice-large             --profile package/production/MISSING_PROFILE.bin --text "This must not render."             --performance neutral --output forbidden.wav > fail_stdout.txt 2> fail_stderr.txt
          RC=$?
          set -e
          test "$RC" -ne 0
          test ! -e forbidden.wav
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path("cold_start.wav")
          r={"cold_start_generated":p.exists() and p.stat().st_size>44,
             "cold_start_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
             "missing_profile_exit_nonzero":True,
             "silent_fallback_output_created":pathlib.Path("forbidden.wav").exists(),
             "status":"PASS"}
          pathlib.Path("COLD_START_RECEIPT.json").write_text(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mari-voice-v1-cold-start-xvector
          path: |
            cold_start.wav
            cold_start_meta.json
            COLD_START_RECEIPT.json
            fail_stderr.txt
          retention-days: 14
          compression-level: 0
