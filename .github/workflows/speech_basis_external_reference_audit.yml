name: speech-basis-external-reference-audit
on:
  push:
    branches: [speech-basis-family-probe-20260926]
    paths: ['.github/workflows/speech_basis_external_reference_audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6313e6f99b35bfa04dbd18c2cb1634ad6c0de540
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy<2' scipy soundfile requests
      - name: Recover deterministic AMI excerpts and word timing evidence
        run: |
          mkdir -p reference_bank
          python -m omega_voice.generative_v5.fetch_ami_annotations reference_bank
          python -m omega_voice.performance_transfer_v1.fetch_ami_performance_refs reference_bank
          python - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path('reference_bank');out=root/'performance_refs'
          ns='{http://nite.sourceforge.net/}id';rows=[]
          for p in sorted(out.glob('*.provenance.json')):
              obj=json.loads(p.read_text());agent=obj['agent'];wanted=set(obj['annotation_word_ids'])
              words=[]
              for w in ET.parse(root/f'annotations/words/ES2002a.{agent}.words.xml').getroot():
                  if w.get(ns) in wanted:
                      words.append({'id':w.get(ns),'text':w.text,'start_s':float(w.get('starttime')),'end_s':float(w.get('endtime'))})
              words.sort(key=lambda w:w['start_s'])
              gaps=[{'after':a['text'],'before':b['text'],'gap_s':b['start_s']-a['end_s']} for a,b in zip(words,words[1:])]
              rows.append({'reference':obj['reference'],'words':words,'interword_gaps':gaps,'role':'ANALYSIS_ONLY_NOT_SYNTHESIS_CONDITIONING','causal_interpretation':'not inferred from timing alone'})
          (out/'WORD_TIMING_EVIDENCE.json').write_text(json.dumps({'examples':rows,'scope':'three short external examples; not population norms or a fitted Mari motor model'},indent=2)+'\n')
          (out/'USE_BOUNDARY.json').write_text(json.dumps({'use':'external observation and comparison only','voice_conditioning_allowed':False,'training_allowed':False,'new_Mari_identity_evidence':False},indent=2)+'\n')
          PY
          cp omega_voice/performance_transfer_v1/NEGATIVE_EVIDENCE_2026-09-22.json reference_bank/performance_refs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basis-external-natural-speech-evidence
          path: reference_bank/performance_refs/
          retention-days: 14
