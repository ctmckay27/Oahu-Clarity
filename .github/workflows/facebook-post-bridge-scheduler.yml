name: Facebook Post Bridge Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out isolated Facebook bridge
        uses: actions/checkout@v4
        with:
          ref: automation/facebook-post-bridge

      - name: Check credential setup
        id: preflight
        shell: bash
        env:
          FB_LOGIN: ${{ secrets.FB_LOGIN }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
        run: |
          if [ -z "$FB_LOGIN" ] || [ -z "$FB_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Facebook bridge is installed but inactive. Add Actions secrets FB_LOGIN and FB_PASSWORD."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this request was already processed
        if: steps.preflight.outputs.ready == 'true'
        id: processed
        uses: actions/cache@v4
        with:
          path: .facebook-bridge-state
          key: facebook-post-${{ hashFiles('automation/post.json') }}

      - name: Set up Node
        if: steps.preflight.outputs.ready == 'true' && steps.processed.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        if: steps.preflight.outputs.ready == 'true' && steps.processed.outputs.cache-hit != 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Post to Facebook
        if: steps.preflight.outputs.ready == 'true' && steps.processed.outputs.cache-hit != 'true'
        env:
          FB_LOGIN: ${{ secrets.FB_LOGIN }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
        run: node automation/facebook-post.js

      - name: Mark request processed
        if: steps.preflight.outputs.ready == 'true' && steps.processed.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .facebook-bridge-state
          cp automation/post.json .facebook-bridge-state/processed.json
