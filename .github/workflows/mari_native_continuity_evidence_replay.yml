name: mari-native-continuity-evidence-replay

on:
  push:
    branches: [mari-native-continuity-verifier-fix-20260920]
    paths: ['.github/workflows/mari_native_continuity_evidence_replay.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy<2' soundfile faster-whisper==1.2.1
      - uses: actions/download-artifact@v4
        with:
          name: mari-native-continuity-v1-diagnostic-abc
          github-token: ${{ github.token }}
          run-id: 35507991873
          path: evidence
      - name: Compare fixed-input ASR conditions; preserve full transcripts
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, pathlib, re
          import soundfile as sf
          from faster_whisper import WhisperModel
          root = pathlib.Path('evidence')
          reference = json.loads((root/'ABC_DIAGNOSTIC_RECEIPT.json').read_text())
          def words(text):
              return re.findall(r"[a-z0-9]+(?:'[a-z0-9]+)?", text.lower())
          def distance(a, b):
              prev = list(range(len(b)+1))
              for i, x in enumerate(a, 1):
                  row = [i]
                  for j, y in enumerate(b, 1):
                      row.append(min(row[-1]+1, prev[j]+1, prev[j-1]+(x != y)))
                  prev = row
              return prev[-1]
          expected = reference['matched_text']
          report = {
              'status': 'DIAGNOSTIC_NOT_PRODUCTION_ACCEPTANCE',
              'source_run': 35507991873,
              'source_commit': 'b045d88faf79e985b7207be906a12677a1ca4aec',
              'unchanged_wer_threshold': 0.15,
              'expected_text_supplied_to_asr': False,
              'versions': {p: importlib.metadata.version(p) for p in ('faster-whisper', 'ctranslate2', 'numpy')},
              'conditions': [],
          }
          def save():
              pathlib.Path('ASR_EVIDENCE_REPLAY.json').write_text(json.dumps(report, indent=2)+'\n')
          model = WhisperModel('small.en', device='cpu', compute_type='int8', cpu_threads=4)
          for label, row in reference['audio'].items():
              path = root/row['path']
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              assert sha == row['sha256'], (label, 'input artifact hash mismatch')
              for vad in (False, True):
                  segments, info = model.transcribe(str(path), language='en', beam_size=5, temperature=0, condition_on_previous_text=False, vad_filter=vad)
                  segments = list(segments)
                  hypothesis = ' '.join(s.text.strip() for s in segments)
                  result = {
                      'label': label, 'model': 'small.en', 'vad_filter': vad,
                      'input_sha256': sha, 'asr_text': hypothesis,
                      'wer': distance(words(expected), words(hypothesis))/len(words(expected)),
                      'duration': info.duration, 'duration_after_vad': info.duration_after_vad,
                      'segments': [dict(start=s.start, end=s.end, text=s.text, avg_logprob=s.avg_logprob, no_speech_prob=s.no_speech_prob) for s in segments],
                  }
                  report['conditions'].append(result)
                  print(json.dumps(result), flush=True)
                  save()
          # Fixed, unprompted tail crop is a diagnostic, not a replacement gate.
          y, sr = sf.read(root/'C_native_continuity.wav', dtype='float32')
          tail = pathlib.Path('C_tail_from_20s.wav')
          sf.write(tail, y[20*sr:], sr)
          segments, info = model.transcribe(str(tail), language='en', beam_size=5, temperature=0, condition_on_previous_text=False, vad_filter=False)
          segments = list(segments)
          report['C_tail_from_20s'] = [dict(start=s.start+20, end=s.end+20, text=s.text, avg_logprob=s.avg_logprob, no_speech_prob=s.no_speech_prob) for s in segments]
          save()
          print(json.dumps(report['C_tail_from_20s']), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mari-native-continuity-asr-evidence-replay
          path: |
            ASR_EVIDENCE_REPLAY.json
            C_tail_from_20s.wav
          retention-days: 14
