name: mari-native-prosody-basis-v1-verify

on:
  push:
    branches: [mari-native-prosody-basis-v1-20260923]
    paths:
      - 'omega_voice/native_prosody_basis_v1/**'
      - '.github/workflows/mari_native_prosody_basis_v1_verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  QWEN_C_SHA: e391ec5467b0218eeb175f4888ad65b259d1e7c7
  CV_REV: 0c0e3051f131929182e2c023b9537f8b1c68adfe
  PROD_RUN: "35405800719"
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy<2' soundfile
      - name: Compile
        run: |
          python -m py_compile             omega_voice/native_prosody_basis_v1/common.py             omega_voice/native_prosody_basis_v1/tempo_calibration.py             omega_voice/native_prosody_basis_v1/focus_calibration.py             omega_voice/native_prosody_basis_v1/qualify.py
      - name: Regression
        run: python -m unittest discover -s omega_voice/native_prosody_basis_v1/tests -v

  calibrate-and-qualify:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install calibration and evaluation dependencies
        run: |
          python -m pip install 'numpy<2' soundfile scipy scipy-openblas32 librosa praat-parselmouth transformers tokenizers faster-whisper==1.2.1 'huggingface-hub>=0.27,<1'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -q 'torch==2.5.1' 'torchaudio==2.5.1'
          python -m pip install -q 'speechbrain==1.0.3'

      - name: Recover selected Mari Voice v1 production package
        uses: actions/download-artifact@v4
        with:
          name: mari-voice-v1-production-xvector
          github-token: ${{ github.token }}
          run-id: ${{ env.PROD_RUN }}
          path: package

      - name: Build exact patched one-session renderer and codec encoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git ffmpeg
          mkdir -p native_root/continuation native_root/models native_root/recovered/production_release
          cp -R package/production native_root/recovered/production_release/production
          git init native_root/continuation/engine
          git -C native_root/continuation/engine remote add origin https://github.com/gabriele-mastrapasqua/qwen3-tts.git
          git -C native_root/continuation/engine fetch --depth 1 origin "$QWEN_C_SHA"
          git -C native_root/continuation/engine checkout --detach FETCH_HEAD
          test "$(git -C native_root/continuation/engine rev-parse HEAD)" = "$QWEN_C_SHA"
          python -m omega_voice.generative_v5.build_native native_root/continuation/engine
          sed "s|/resolve/main|/resolve/$CV_REV|g" native_root/continuation/engine/download_model.sh > native_root/continuation/engine/pinned_cv_download.sh
          bash native_root/continuation/engine/pinned_cv_download.sh --model large --dir native_root/models/qwen-custom
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('native_root/models/qwen-custom')
          selected=['config.json','model.safetensors','speech_tokenizer/config.json','speech_tokenizer/model.safetensors']
          files={}
          for rel in selected:
              p=root/rel
              if not p.is_file(): raise SystemExit('missing pinned model file: '+rel)
              files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'MARI_PINNED_MODEL_RECEIPT.json').write_text(json.dumps({
              'revision':os.environ['CV_REV'],'files':files,
              'scope':'exact files required by native prosody-basis calibration'
          },indent=2)+'\n')
          PY

      - name: Generate same-Mari calibration carriers with non-starving source release
        run: |
          python - <<'PY'
          import pathlib
          from transformers import AutoTokenizer
          from omega_voice.generative_v5.native import render
          from omega_voice.generative_v5.text_release import write_release
          from omega_voice.native_prosody_basis_v1.tempo_calibration import TEXTS
          from omega_voice.native_prosody_basis_v1.focus_calibration import CASES

          root=pathlib.Path('native_root')
          tok=AutoTokenizer.from_pretrained(root/'models/qwen-custom',local_files_only=True)

          def release(text,path):
              e=tok(text,add_special_tokens=False)
              ids=list(e['input_ids'])
              return write_release(path,ids,[0]+list(range(len(ids))))['path']

          attack_dir=root/'continuation/calibration';attack_dir.mkdir(parents=True)
          for i,text in enumerate(TEXTS):
              out=attack_dir/f'pair_{i}_statement.wav'
              rel=release(text,attack_dir/f'pair_{i}.mrl')
              render(root,text,out,seed=170000+i,incremental_text=True,text_release=rel,profile_mode='xvector')

          focus_dir=root/'continuation/prosody_basis_focus_sources';focus_dir.mkdir(parents=True)
          for i,(text,target) in enumerate(CASES):
              out=focus_dir/f'{i}.wav'
              rel=release(text,focus_dir/f'{i}.mrl')
              render(root,text,out,seed=170100+i,incremental_text=True,text_release=rel,profile_mode='xvector')
          PY

      - name: Calibrate onset pressure candidate
        run: python -m omega_voice.generative_v5.attack_calibration native_root

      - name: Calibrate tempo candidate
        run: python -m omega_voice.native_prosody_basis_v1.tempo_calibration native_root

      - name: Calibrate local-focus candidate
        run: python -m omega_voice.native_prosody_basis_v1.focus_calibration native_root

      - name: Qualify candidates on held-out free generation
        run: python -m omega_voice.native_prosody_basis_v1.qualify native_root

      - name: Build concise receipt
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('native_root/continuation/native_prosody_basis_v1/QUALIFICATION.json')
          if p.exists():
              q=json.loads(p.read_text())
              out={
                'status':q['status'],
                'qualified_axes':q['qualified_axes'],
                'new_qualified_axis_count':q['new_qualified_axis_count'],
                'axis_status':{k:v['status'] for k,v in q['axes'].items()},
                'perceptual_naturalness_proven':q['perceptual_naturalness_proven'],
                'proof_ceiling':q['proof_ceiling'],
              }
          else:
              out={'status':'CALIBRATION_OR_QUALIFICATION_FAILED_BEFORE_RECEIPT'}
          pathlib.Path('PROSODY_BASIS_RECEIPT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mari-native-prosody-basis-v1-calibration
          path: |
            PROSODY_BASIS_RECEIPT.json
            native_root/continuation/attack_calibration/
            native_root/continuation/prosody_basis_tempo/
            native_root/continuation/prosody_basis_focus/
            native_root/continuation/native_prosody_basis_v1/
          retention-days: 14
          compression-level: 0
