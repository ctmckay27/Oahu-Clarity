name: Mari404 Browser Actuator

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'browser-actuator/**'
      - '.github/workflows/mari404-browser-actuator.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-actuator/package.json

      - name: Install browser actuator dependencies
        working-directory: browser-actuator
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Install graphical session dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify x11-utils
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Probe existing Mari404ever infrastructure
        shell: bash
        run: |
          set +e
          {
            echo "=== UTC ==="
            date -u
            echo
            echo "=== DNS: git.chatgpt-team.site ==="
            getent hosts git.chatgpt-team.site
            echo "dns_exit=$?"
            echo
            echo "=== Git remote read probe (no interactive auth) ==="
            GIT_TERMINAL_PROMPT=0 git ls-remote --heads "https://git.chatgpt-team.site/f674afb2-ae18-4aac-8cb9-0e328c40a32d/appgprj_6aa06a5c8a608191a2d5cf5f9ef5543a.git"
            echo "git_exit=$?"
            echo
            echo "=== ChatGPT Sites entry HTTP ==="
            curl -L -sS -o /dev/null -D - --max-time 20 https://chatgpt.com/sites
            echo "chatgpt_exit=$?"
            echo
            echo "=== Mari404ever public site HTTP ==="
            curl -L -sS -o /dev/null -D - --max-time 20 https://mari404ever.carlitoesblanco.chatgpt.site/
            echo "site_exit=$?"
          } > /tmp/reachability.txt 2>&1
          cat /tmp/reachability.txt

      - name: Upload reachability evidence
        uses: actions/upload-artifact@v4
        with:
          name: mari404-reachability
          path: /tmp/reachability.txt
          retention-days: 1
          if-no-files-found: error

      - name: Start scoped browser actuator
        shell: bash
        run: |
          set -euo pipefail
          ACTUATOR_TOKEN="$(openssl rand -hex 32)"
          VNC_PASSWORD="$(openssl rand -hex 16)"
          export ACTUATOR_TOKEN VNC_PASSWORD
          export DISPLAY=:99
          export PROFILE_DIR=/tmp/mari404-chrome-profile

          Xvfb "$DISPLAY" -screen 0 1440x900x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          for i in $(seq 1 50); do
            xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
            sleep 0.2
          done

          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass >/dev/null
          x11vnc -display "$DISPLAY" -rfbport 5900 -rfbauth /tmp/vnc.pass -forever -shared -localhost -noxdamage >/tmp/x11vnc.log 2>&1 &
          websockify 6080 localhost:5900 >/tmp/websockify.log 2>&1 &

          (cd browser-actuator && node server.js >/tmp/actuator.log 2>&1) &
          for i in $(seq 1 80); do
            curl -fsS http://127.0.0.1:10000/healthz >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:10000/healthz >/dev/null

          /tmp/cloudflared tunnel --url http://127.0.0.1:10000 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 120); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -1 || true)"
            [ -n "$URL" ] && break
            sleep 0.5
          done
          if [ -z "${URL:-}" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          EXPIRES_AT="$(date -u -d '+45 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"url":"%s","actuator_token":"%s","vnc_password":"%s","expires_at":"%s"}'             "$URL" "$ACTUATOR_TOKEN" "$VNC_PASSWORD" "$EXPIRES_AT" >/tmp/session.json

          openssl pkeyutl -encrypt -pubin             -inkey browser-actuator/session_public.pem             -in /tmp/session.json             -out /tmp/session.enc             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256

          rm -f /tmp/session.json
          echo "Encrypted actuator session metadata created."
          echo "The temporary actuator will remain available for about 45 minutes."

      - name: Upload encrypted session metadata
        uses: actions/upload-artifact@v4
        with:
          name: mari404-actuator-session
          path: /tmp/session.enc
          retention-days: 1
          if-no-files-found: error

      - name: Keep actuator available
        run: sleep 2700
