name: omega-voice-model-bridge

on:
  push:
    branches:
      - omega-voice-model-bridge-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system phonemizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng

      - name: Build self-contained runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/site-packages bundle/models bundle/output
          python -m pip install --upgrade pip
          python -m pip install --target bundle/site-packages onnxruntime kokoro-onnx soundfile

          curl -fL --retry 5 --retry-delay 2 \
            -o bundle/models/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fL --retry 5 --retry-delay 2 \
            -o bundle/models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  bundle/models/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  bundle/models/voices-v1.0.bin' | sha256sum -c -

          PYTHONPATH="$PWD/bundle/site-packages" python - <<'PY'
          import json, hashlib, os, sys
          import soundfile as sf
          from kokoro_onnx import Kokoro

          root = os.path.abspath('bundle')
          model = os.path.join(root, 'models', 'kokoro-v1.0.onnx')
          voices = os.path.join(root, 'models', 'voices-v1.0.bin')
          k = Kokoro(model, voices)
          text = "This is the neural renderer transport smoke test. The waveform is generated by Kokoro, not eSpeak."
          samples, sr = k.create(text, voice='af_heart', speed=1.0, lang='en-us')
          out = os.path.join(root, 'output', 'kokoro_smoke.wav')
          sf.write(out, samples, sr)

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          manifest = {
              'python': sys.version,
              'backend': 'kokoro-onnx',
              'model': {'path':'models/kokoro-v1.0.onnx','sha256':sha256(model),'bytes':os.path.getsize(model)},
              'voices': {'path':'models/voices-v1.0.bin','sha256':sha256(voices),'bytes':os.path.getsize(voices)},
              'smoke': {'path':'output/kokoro_smoke.wav','sha256':sha256(out),'bytes':os.path.getsize(out),'sample_rate':sr},
              'text': text,
              'network_required_at_inference': False
          }
          with open(os.path.join(root, 'manifest.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

          du -sh bundle

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: omega-kokoro-runtime-py313
          path: bundle/
          compression-level: 0
          retention-days: 7
